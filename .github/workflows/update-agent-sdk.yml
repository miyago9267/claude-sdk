name: Update Claude Agent SDK

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update and verify Agent SDK
        run: bun run update:agent-sdk

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-agent-sdk
          delete-branch: true
          title: 'chore: 更新 Claude Agent SDK'
          commit-message: 'chore: 更新 Claude Agent SDK'
          body: |
            Automated update of `@anthropic-ai/claude-agent-sdk` to the latest npm version.

            The repository verification script passed:
            - `bun install --frozen-lockfile`
            - `bun test src/`
            - `bun build src/index.ts --target bun`
          labels: dependencies
